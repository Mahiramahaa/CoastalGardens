<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#142f3d"><meta name="apple-mobile-web-app-capable" content="yes"><title>Coastal Gardens — Play 3D</title><link rel="manifest" href="manifest.webmanifest"><style>
